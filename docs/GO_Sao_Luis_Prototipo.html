 case 'score':if(needRole('person',`/vagas/${id}`)){state.scoreJob=id;render();setTimeout(()=>document.querySelector('.score-wrap')?.scrollIntoView({behavior:'smooth',block:'center'}),100)}break;
 case 'request-course':doCourseRequest(id);break;
 case 'course-filter':state.courseFilter=value;render();break;
 case 'clear-jobs':state.filter='';state.location='';state.type='';go('/vagas');render();break;
 case 'print-cv':window.print();break;
 case 'withdraw':confirmModal('Desistir da candidatura','Deseja registrar desistência desta candidatura demonstrativa?',()=>{const x=data.applications.find(x=>x.id===id);if(x){x.status='Desistência';save();render();toast('Desistência demonstrativa registrada.')}},'Registrar desistência');break;
 case 'toggle-job':{const j=data.jobs.find(j=>j.id===id&&j.owner==='empresa');if(j){j.active=!j.active;save();render();toast(`Vaga ${j.active?'reaberta':'encerrada'} no protótipo.`)}break}
 case 'clear-services':{const inp=document.getElementById('services-query');if(inp)inp.value='';const out=document.getElementById('services-results');if(out)out.innerHTML=data.professionals.map(profCard).join('');break}
 case 'contact-prof':{const p=data.professionals.find(p=>p.id===id);toast(`Interesse demonstrativo registrado para ${p?.name||'profissional'}. Nenhuma mensagem real foi enviada.`);break}
 case 'course-attendance':{const r=data.courseRequests.find(r=>r.id===id);if(r){r.attendance=(r.attendance||0)+1;save();toast(`Presença demonstrativa registrada (${r.attendance}).`)}break}
 default:break;
 }});
document.addEventListener('submit',e=>{const form=e.target,id=form.id;if(!id)return;e.preventDefault();const fd=new FormData(form),val=k=>String(fd.get(k)||'').trim();switch(id){
 case 'hero-search':state.filter=val('query');state.location='';state.type='';go('/vagas?busca='+encodeURIComponent(val('query')));break;
 case 'job-filters':state.filter=val('query');state.location=val('location');state.type=val('mode');go('/vagas?busca='+encodeURIComponent(state.filter));render();break;
 case 'login-form':toast('Autenticação real indisponível. Use “Candidato demo”, “Empresa demo” ou “SEMISPE demo”.');break;
 case 'forgot-form':toast('Recuperação de senha não conectada. Demonstração apenas.');break;
 case 'signup-form':{if(val('password')!==val('password2')){toast('As senhas não coincidem.');return}if(form.dataset.type==='empresa'){if(!/^[\d.\/-]{14,18}$/.test(val('cnpj'))){toast('Informe um CNPJ no formato 00.000.000/0000-00.');return}data.company={name:val('name'),cnpj:val('cnpj'),email:val('email'),sector:val('sector')||'Não informado',location:'São Luís',validated:'Não verificado (demonstração)'};save();setRole('company')}else{data.profile={...data.profile,name:val('name'),neighborhood:val('neighborhood'),email:val('email'),phone:val('phone')};save();setRole('person')}toast('Conta ilustrativa criada localmente. Nenhum dado foi enviado a servidor.');break}
 case 'resume-form':{const keys=['name','email','phone','neighborhood','city','objective','summary','education','experience','skills','courses','languages'];for(const k of keys)data.profile[k]=val(k);save();go('/meu-curriculo');toast('Currículo salvo neste navegador.');break}
 case 'upload-form':{const f=document.getElementById('cv-file')?.files?.[0];if(f)toast(`Arquivo “${f.name}” selecionado. Extração não implementada nesta demonstração.`);break}
 case 'company-job-form':{const editId=Number(form.dataset.id),edit=!!editId;const fields={title:val('title'),location:val('location'),mode:val('mode'),type:val('type'),openings:Math.max(1,Number(val('openings'))||1),salary:val('salary')===''?null:Number(val('salary')),deadline:val('deadline'),education:val('education'),description:val('description'),skills:val('skills').split(',').map(x=>x.trim()).filter(Boolean),desired:val('desired').split(',').map(x=>x.trim()).filter(Boolean),benefits:val('benefits').split(',').map(x=>x.trim()).filter(Boolean)};if(!fields.deadline||!fields.title||!fields.location){toast('Preencha os campos obrigatórios.');return}if(fields.deadline<'2026-11-14'){toast('A data final não pode estar no passado em relação à data da demonstração.');return}if(edit){const j=data.jobs.find(j=>j.id===editId&&j.owner==='empresa');if(!j)return;Object.assign(j,fields)}else{data.jobs.unshift({id:Math.max(0,...data.jobs.map(j=>j.id))+1,company:data.company.name,initials:data.company.name.split(' ').map(x=>x[0]).slice(0,2).join('').toUpperCase(),city:'São Luís',published:'2026-11-14',experience:'A definir',active:true,owner:'empresa',...fields})}save();go('/empresa/vagas');toast(edit?'Vaga demonstrativa atualizada.':'Vaga demonstrativa publicada.');break}
 case 'admin-course-form':{const type=val('type');const record={id:Math.max(...data.courses.map(c=>c.id),0)+1,title:val('title'),category:val('category')||'Outros',institution:val('institution')||'A confirmar',type,mode:val('mode'),location:val('location')||'São Luís',hours:Number(val('hours'))||24,description:val('description'),skills:val('skills').split(',').map(x=>x.trim()).filter(Boolean),start:type==='scheduled'?val('start'):'',deadline:type==='scheduled'?val('deadline'):'',openings:type==='scheduled'?Number(val('openings'))||25:null,requests:0,confirmed:0,completed:0};if(!record.title||!record.description){toast('Informe título e descrição.');return}data.courses.unshift(record);save();go('/admin/cursos');toast('Curso demonstrativo cadastrado.');break}
 case 'services-filter':{const q=String(document.getElementById('services-query')?.value||'').toLowerCase();const filtered=data.professionals.filter(p=>(p.category+' '+p.skills.join(' ')+' '+p.location+' '+p.name).toLowerCase().includes(q));document.getElementById('services-results').innerHTML=filtered.length?filtered.map(profCard).join(''):emptyState('Sem perfis encontrados','Experimente uma nova categoria ou competência.');break}
 case 'wa-form':{const t=val('message');waRespond(t);break}
 default:break;
 }});
document.addEventListener('change',e=>{const el=e.target;if(el.id==='persona'){setRole(el.value);return}if(el.id==='public-profile'){data.profile.publicProfile=el.checked;save();toast('Preferência de visibilidade demonstrativa salva.');return}if(el.id==='wa-linked'){data.profile.whatsapp=el.checked;save();toast('Vinculação demonstrativa atualizada. Nenhum WhatsApp real foi conectado.');return}if(el.id==='course-type'){const demand=el.value==='demand';document.querySelectorAll('.scheduled-only').forEach(x=>x.classList.toggle('hide',demand));return}if(el.dataset.courseStatus){const id=Number(el.dataset.courseStatus),r=data.courseRequests.find(x=>x.id===id);if(r){r.status=el.value;save();toast('Acompanhamento demonstrativo atualizado.')}return}});
document.addEventListener('click',e=>{const m=e.target.closest('#mobile-toggle');if(m){state.mobile=!state.mobile;render();return}if(e.target.closest('.mobile-nav a'))state.mobile=false});
window.addEventListener('hashchange',()=>{state.mobile=false;render()});
render();
