function header(route){const nav=currentNav();return `<div class="demo-strip no-print"><div class="container"><span class="demo-label"><span class="demo-dot"></span>PROTÓTIPO INTERATIVO · Dados fictícios · Sem serviços oficiais conectados</span><div class="right"><label for="persona">Explorar como</label><select id="persona" aria-label="Alterar perfil de demonstração"><option value="guest" ${state.role==='guest'?'selected':''}>Visitante</option><option value="person" ${state.role==='person'?'selected':''}>Candidato</option><option value="company" ${state.role==='company'?'selected':''}>Empresa</option><option value="admin" ${state.role==='admin'?'selected':''}>SEMISPE</option></select></div></div></div><header class="site-header no-print"><div class="container">${brand()}<nav class="nav" aria-label="Navegação principal">${nav.map(([name,path])=>`<a class="${path===route?'current':''}" href="#${path}">${esc(name)}</a>`).join('')}</nav><div class="header-actions">${state.role==='guest'?`<a class="btn btn-yellow" href="#/entrar">Entrar ${icon('arrow','sm')}</a>`:`<a class="btn btn-ghost btn-sm" href="#${state.role==='person'?'/perfil':state.role==='company'?'/empresa/perfil':'/admin'}">${icon('user','sm')} ${state.role==='person'?'Minha conta':state.role==='company'?'Minha empresa':'Admin'}</a>`}<button class="mobile-toggle" id="mobile-toggle" aria-label="Abrir menu" aria-expanded="${state.mobile}">${icon(state.mobile?'x':'menu')}</button></div></div><nav class="mobile-nav ${state.mobile?'open':''}" aria-label="Navegação móvel">${nav.map(([n,p])=>`<a href="#${p}">${esc(n)}</a>`).join('')}${state.role==='person'?`<a href="#/meus-cursos">Meus cursos</a><a href="#/perfil">Meu perfil</a>`:''}${state.role==='company'?`<a href="#/empresa/perfil">Perfil da empresa</a>`:''}${state.role==='admin'?`<a href="#/admin/indicadores">Indicadores</a>`:''}${state.role==='guest'?`<a href="#/entrar">Entrar / Criar conta</a>`:''}</nav></header>`}
function footer(){return `<footer class="site-footer no-print"><div class="container"><div class="grid cols-3"><div><h3 style="color:#fff;font-size:27px">GO São Luís</h3><p style="font-size:13px;max-width:300px;margin-top:12px">Uma proposta de conexão entre talentos, empresas e oportunidades de qualificação para São Luís.</p><p class="small mt16" style="color:#A6C6D9">Conceito para futura integração ao Parque Tecnológico de São Luís.</p></div><div><h4>Explorar</h4><a href="#/vagas">Encontrar vagas</a><a href="#/cursos">Cursos e capacitações</a><a href="#/meu-curriculo">Meu currículo</a><a href="#/sobre">Sobre o programa</a></div><div><h4>Acessos</h4><a href="#/cadastro/pessoa">Sou candidato</a><a href="#/cadastro/empresa">Sou empresa</a><a href="#/entrar">Entrar na conta</a><a href="#/sobre">Como funciona</a></div></div><div class="bottom"><span>Projeto demonstrativo · Hackathon UNDB + SEMISPE · São Luís do Futuro</span><span>Dados e ações simulados; nenhuma inscrição ou contratação real.</span></div></div></footer>`}
function pageHead(title,desc,crumb=''){return `<section class="page-head"><div class="container">${crumb?`<div class="breadcrumb"><a href="#/">Início</a>${icon('chevron','sm')}<span>${esc(crumb)}</span></div>`:''}<h1>${esc(title)}</h1><p>${esc(desc)}</p></div></section>`}
function sectionHeading(label,title,subtitle,right=''){return `<div class="heading-row"><div><div class="eyebrow">${label}</div><h2 style="margin-top:10px">${title}</h2>${subtitle?`<p class="title-intro">${subtitle}</p>`:''}</div>${right}</div>`}
function jobCard(job){return `<article class="card job-card raise"><div class="topline"><div class="flex"><span class="company-mark">${esc(job.initials||String(job.company).slice(0,2).toUpperCase())}</span><div><div class="strong" style="font-size:12px">${esc(job.company)}</div><div class="small text-muted">${esc(job.location)}, ${esc(job.city||'São Luís')}</div></div></div><span class="badge ${job.active?'green':'grey'}">${job.active?'Ativa':'Encerrada'}</span></div><div><h3>${esc(job.title)}</h3><div class="job-meta mt12"><span>${icon('brief','sm')}${esc(job.type||'A definir')}</span><span>${icon('pin','sm')}${esc(job.mode)}</span><span>${icon('users','sm')}${fmtNum(job.openings)} vaga(s)</span></div></div><p class="description">${esc(job.description)}</p><div class="tag-row">${(job.skills||[]).slice(0,3).map(x=>`<span class="chip">${esc(x)}</span>`).join('')}</div><div class="card-footer"><div><strong style="font-size:14px">${fmtMoney(job.salary)}</strong><div class="tiny text-muted">Até ${shortDate(job.deadline)}</div></div><a class="btn btn-ghost btn-sm" href="#/vagas/${job.id}">Ver vaga ${icon('arrow','sm')}</a></div></article>`}
function courseCard(c){return `<article class="card course-card raise"><div class="course-top ${c.type==='demand'?'green':''}">${icon('graduation','lg')}<span class="badge ${c.type==='demand'?'orange':'green'}">${c.type==='demand'?'Sob demanda':'Turma programada'}</span></div><div><div class="small text-muted strong">${esc(c.institution)}</div><h3 class="mt8">${esc(c.title)}</h3><div class="job-meta mt12"><span>${icon('clock','sm')}${esc(c.hours)} horas</span><span>${icon('pin','sm')}${esc(c.location)}</span></div></div><p class="description">${esc(c.description)}</p><div class="card-footer"><div class="small text-muted">${c.type==='scheduled'?`Início: ${shortDate(c.start)}`:'Aguardando formação de turma'}</div><a class="btn btn-ghost btn-sm" href="#/cursos/${c.id}">Ver detalhes ${icon('arrow','sm')}</a></div></article>`}
function home(){return `<section class="hero"><div class="container hero-layout"><div><div class="eyebrow">O futuro começa com oportunidades</div><h1>Seu talento merece <span class="highlight">ir mais longe.</span></h1><p>Encontre vagas, descubra cursos e conecte-se a oportunidades de trabalho em São Luís. Um novo caminho para quem quer crescer.</p><div class="hero-actions"><a class="btn btn-yellow" href="#/vagas">Encontrar vagas ${icon('arrow','sm')}</a><a class="btn btn-ghost" href="#/cursos">Explorar cursos</a></div><form class="search-panel" id="hero-search"><div class="search-entry">${icon('search')}<label class="sr-only" for="hero-query">O que você procura?</label><input id="hero-query" name="query" placeholder="Cargo, profissão ou palavra-chave" /></div><button class="btn" type="submit">Buscar ${icon('arrow','sm')}</button></form><div class="hero-trust"><span class="flex" style="gap:6px">${icon('checkCircle','sm')} Cadastro gratuito</span><span class="flex" style="gap:6px">${icon('checkCircle','sm')} Vagas e cursos</span><span class="flex" style="gap:6px">${icon('checkCircle','sm')} Foco em Itaqui-Bacanga</span></div></div><div class="hero-visual" aria-hidden="true"><div class="visual-stage"></div><div class="hero-person"><div class="person-illustration"><div class="hair"></div><div class="head"></div><div class="neck"></div><div class="shirt"></div><div class="laptop"></div></div></div><div class="float-card a"><div class="flex">${icon('brief','sm')}<strong>Nova oportunidade</strong></div><small>Logística · São Luís</small></div><div class="float-card b"><div class="flex">${icon('checkCircle','sm')}<strong>Currículo pronto</strong></div><small>Seu próximo passo</small></div><div class="float-card c"><div class="flex">${icon('graduation','sm')}<strong>Capacitação</strong></div><small>Aprenda novas habilidades</small></div></div></div></section><section class="section"><div class="container">${sectionHeading('Três caminhos, um só lugar','Encontre o que você precisa','Seja para conquistar uma vaga, desenvolver competências ou contratar talentos, existe um caminho para você.')}<div class="grid cols-3"><article class="card entry-card raise"><span class="icon-disc">${icon('brief','lg')}</span><h3>Estou buscando emprego</h3><p>Conheça vagas e apresente seu currículo para novas oportunidades.</p><a class="link flex" href="#/vagas">Explorar vagas ${icon('arrow','sm')}</a></article><article class="card entry-card raise"><span class="icon-disc green">${icon('graduation','lg')}</span><h3>Quero me capacitar</h3><p>Encontre formações com turmas disponíveis e registre interesse em novos cursos.</p><a class="link flex" href="#/cursos">Conhecer cursos ${icon('arrow','sm')}</a></article><article class="card entry-card raise"><span class="icon-disc yellow">${icon('building','lg')}</span><h3>Represento uma empresa</h3><p>Divulgue vagas gratuitamente e encontre profissionais por área de atuação.</p><a class="link flex" href="#/cadastro/empresa">Cadastrar empresa ${icon('arrow','sm')}</a></article></div></div></section><section class="section bg-mist"><div class="container">${sectionHeading('Emprego','Vagas em destaque','Oportunidades ilustrativas para explorar o funcionamento do portal.',`<a class="btn btn-ghost" href="#/vagas">Todas as vagas ${icon('arrow','sm')}</a>`)}<div class="job-grid">${data.jobs.filter(j=>j.active).slice(0,4).map(jobCard).join('')}</div></div></section><section class="section"><div class="container">${sectionHeading('Qualificação','Aprenda para avançar','Cursos com turmas programadas e áreas em levantamento de demanda.',`<a class="btn btn-ghost" href="#/cursos">Todos os cursos ${icon('arrow','sm')}</a>`)}<div class="grid cols-3">${data.courses.slice(0,3).map(courseCard).join('')}</div></div></section><section class="section bg-mist"><div class="container"><div class="card" style="background:#E7F3FA;border-color:#D5E8F5;padding:42px"><div class="grid cols-2" style="align-items:center"><div><div class="eyebrow">Currículo com apoio da IA</div><h2 style="margin:12px 0 16px">Suas experiências contam. Vamos organizá-las?</h2><p class="text-muted">Conte sua trajetória em linguagem simples. A experiência proposta utiliza perguntas guiadas para estruturar seu currículo e orientar a busca por vagas.</p><div class="flex-wrap mt24"><a href="#/meu-curriculo" class="btn btn-yellow">Criar meu currículo ${icon('arrow','sm')}</a><button class="btn btn-ghost" data-act="open-wa">Conhecer o assistente</button></div></div><div class="card" style="background:#fff;max-width:355px;margin:auto;width:100%"><div class="flex">${icon('spark')}<strong>Seu perfil profissional</strong></div><div class="divider"></div><div class="mini-item"><span class="icon-disc green" style="width:36px;height:36px">${icon('check','sm')}</span><div><strong>Experiências</strong><div class="small text-muted">O que você já realizou</div></div></div><div class="mini-item"><span class="icon-disc green" style="width:36px;height:36px">${icon('check','sm')}</span><div><strong>Competências</strong><div class="small text-muted">Aquilo que você sabe fazer</div></div></div><div class="mini-item"><span class="icon-disc green" style="width:36px;height:36px">${icon('check','sm')}</span><div><strong>Interesses</strong><div class="small text-muted">Onde você quer chegar</div></div></div></div></div></div></div></section><section class="section"><div class="container">${sectionHeading('Sua jornada','Como funciona','Um percurso simples para aproximar pessoas, empresas e capacitações.')}<div class="steps"><article class="step"><span class="step-num">01</span><h4>Crie seu perfil</h4><p>Cadastre-se e informe suas experiências e habilidades.</p></article><article class="step"><span class="step-num">02</span><h4>Descubra vagas</h4><p>Encontre oportunidades alinhadas aos seus objetivos.</p></article><article class="step"><span class="step-num">03</span><h4>Capacite-se</h4><p>Conheça cursos que podem fortalecer suas competências.</p></article><article class="step"><span class="step-num">04</span><h4>Acompanhe</h4><p>Consulte suas inscrições, candidaturas e próximas etapas.</p></article></div></div></section><section class="section-sm" style="background:var(--blue);color:#fff"><div class="container space-between" style="flex-wrap:wrap"><div><div class="eyebrow light">Prioridade territorial</div><h2 style="margin:7px 0;font-size:30px">Começamos pelo Itaqui-Bacanga.</h2><p style="font-size:14px;color:#D6EDFA">Uma proposta para aproximar a população das oportunidades de São Luís.</p></div><a class="btn btn-yellow" href="#/sobre">Conhecer o GO ${icon('arrow','sm')}</a></div></section>`}
function jobsPage(){let jobs=data.jobs.filter(j=>j.active);const qs=paramsOf().get('busca')||state.filter;state.filter=qs;const loc=state.location;const mode=state.type;jobs=jobs.filter(j=>(!qs||`${j.title} ${j.company} ${j.description} ${j.skills.join(' ')}`.toLowerCase().includes(qs.toLowerCase()))&&(!loc||j.location.toLowerCase().includes(loc.toLowerCase()))&&(!mode||j.mode===mode));return `${pageHead('Encontre sua próxima oportunidade','Explore vagas de emprego, filtre por região e encontre uma oportunidade alinhada ao seu perfil.','Vagas')}<section class="section-sm"><div class="container"><form class="jobs-toolbar" id="job-filters"><div><label class="control-label" for="job-q">Cargo ou palavra-chave</label><input class="input" name="query" id="job-q" placeholder="Ex.: logística, atendimento, Python" value="${esc(qs)}" /></div><div><label class="control-label" for="job-loc">Bairro ou região</label><select class="select" name="location" id="job-loc"><option value="">Todas as regiões</option>${['Itaqui-Bacanga','Anjo da Guarda','Vila Embratel','Centro','Itaqui'].map(l=>`<option ${state.location===l?'selected':''}>${l}</option>`).join('')}</select></div><div><label class="control-label" for="job-mode">Modalidade</label><select class="select" name="mode" id="job-mode"><option value="">Todas</option>${['Presencial','Híbrido','Remoto'].map(x=>`<option ${state.type===x?'selected':''}>${x}</option>`).join('')}</select></div><button class="btn" type="submit">${icon('filter','sm')} Filtrar</button></form><div class="space-between mb24"><span class="small text-muted">${jobs.length} vaga(s) demonstrativa(s) encontrada(s)</span><button class="btn-text small" data-act="clear-jobs">Limpar filtros</button></div>${jobs.length?`<div class="job-grid">${jobs.map(jobCard).join('')}</div>`:emptyState('Nenhuma vaga encontrada','Experimente outra palavra-chave ou limpe os filtros.','/vagas','Ver todas as vagas')}</div></section>`}
function emptyState(title,desc,to='',link=''){return `<div class="empty"><div class="icon-disc">${icon('search','lg')}</div><h3>${esc(title)}</h3><p class="text-muted small mt8">${esc(desc)}</p>${to?`<a href="#${to}" class="btn btn-ghost mt20">${esc(link)}</a>`:''}</div>`}
function scoreFor(job){const have=new Set(String(data.profile.skills).split(',').map(s=>s.trim().toLowerCase()).filter(Boolean));const required=(job.skills||[]).map(s=>({name:s,ok:have.has(s.toLowerCase())}));const desired=(job.desired||[]).map(s=>({name:s,ok:have.has(s.toLowerCase())}));const rHits=required.filter(x=>x.ok).length,dHits=desired.filter(x=>x.ok).length;const pts=Math.round(((required.length?rHits/required.length:1)*.75+(desired.length?dHits/desired.length:1)*.25)*100);return {pts,required,desired}}
function scorePanel(job){const s=scoreFor(job);return `<div class="score-wrap mt20"><div class="score-header"><strong class="score-number">${s.pts}%</strong><div><strong>Compatibilidade técnica demonstrativa</strong><p class="small text-muted">Critérios ilustrativos por correspondência de competências. Distância não participa do score.</p></div></div><div class="progress mt12"><span style="width:${s.pts}%"></span></div><div class="divider"></div><div class="strong small">Requisitos principais</div><div class="check-list">${s.required.map(x=>`<div class="check-item">${icon(x.ok?'checkCircle':'help','sm')}<span>${esc(x.name)} — <strong>${x.ok?'identificado':'não identificado'}</strong></span></div>`).join('')}</div><div class="strong small mt20">Desejáveis</div><div class="check-list">${s.desired.map(x=>`<div class="check-item">${icon(x.ok?'checkCircle':'help','sm')}<span>${esc(x.name)} — ${x.ok?'identificado':'não identificado'}</span></div>`).join('')||'<span class="small text-muted">Nenhum requisito adicional.</span>'}</div><div class="notice mt20">Um requisito ausente no perfil não significa que a pessoa não possui a competência. O score do protótipo não substitui avaliação humana nem garante contratação.</div><a class="btn btn-ghost btn-sm mt16" href="#/cursos">Ver capacitações</a></div>`}
function jobDetail(id){const j=data.jobs.find(x=>String(x.id)===String(id));if(!j)return missing();const applied=data.applications.some(x=>x.jobId===j.id);return `${pageHead(j.title,`${j.company} · ${j.location}, São Luís`,'Detalhes da vaga')}<section class="section-sm"><div class="container detail-layout"><main class="detail-stack"><div class="card"><div class="flex-wrap mb16"><span class="badge ${j.active?'green':'grey'}">${j.active?'Inscrições abertas':'Encerrada'}</span><span class="badge">${esc(j.mode)}</span><span class="badge">${esc(j.type)}</span></div><h3>Sobre a oportunidade</h3><p class="mt16 text-muted">${esc(j.description)}</p><div class="divider"></div><div class="grid cols-2"><div><span class="small text-muted">Quantidade de vagas</span><div class="strong mt8">${fmtNum(j.openings)} posição(ões)</div></div><div><span class="small text-muted">Remuneração</span><div class="strong mt8">${fmtMoney(j.salary)}</div></div><div><span class="small text-muted">Local</span><div class="strong mt8">${esc(j.location)}, São Luís</div></div><div><span class="small text-muted">Prazo de candidatura</span><div class="strong mt8">${shortDate(j.deadline)}</div></div></div></div><div class="card"><h3>Requisitos obrigatórios</h3><ul class="bullet-list">${[j.education,...j.skills].map(x=>`<li>${esc(x)}</li>`).join('')}</ul><h4 class="mt24">Requisitos desejáveis</h4><ul class="bullet-list">${(j.desired||[]).map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div><div class="card"><h3>Benefícios</h3><div class="check-list">${(j.benefits||[]).map(x=>`<div class="check-item">${icon('checkCircle','sm')}<span>${esc(x)}</span></div>`).join('')}</div></div>${state.role==='person'&&state.scoreJob===j.id?`<div class="card"><h3>Minha compatibilidade</h3>${scorePanel(j)}</div>`:''}</main><aside class="detail-aside"><div class="card"><div class="flex mb16"><span class="company-mark">${esc(j.initials)}</span><div><strong>${esc(j.company)}</strong><p class="small text-muted">Empresa demonstrativa</p></div></div><div class="divider"></div><div class="mini-list"><div class="flex">${icon('calendar','sm')} <span class="small">Publicado em ${shortDate(j.published)}</span></div><div class="flex">${icon('pin','sm')}<span class="small">${esc(j.location)}</span></div><div class="flex">${icon('brief','sm')}<span class="small">${esc(j.mode)}</span></div></div><div class="divider"></div><button class="btn btn-yellow btn-block" ${!j.active?'disabled':''} data-act="apply" data-id="${j.id}">${applied?'Você já se candidatou':'Candidatar-me'} ${icon('arrow','sm')}</button><button class="btn btn-ghost btn-block mt12" data-act="score" data-id="${j.id}">${icon('spark','sm')} ${state.role==='person'&&state.scoreJob===j.id?'Atualizar score':'Ver minha compatibilidade'}</button><p class="tiny text-muted mt16">Candidaturas e scores são simulados neste arquivo. A empresa não visualiza o score.</p></div><a href="#/vagas" class="link flex mt20">${icon('arrowLeft','sm')} Voltar às vagas</a></aside></div></section>`}
function coursesPage(){let courses=data.courses.filter(c=>(!state.courseFilter||state.courseFilter===c.type));return `${pageHead('Cursos e capacitações','Encontre uma turma programada ou registre seu interesse em novas formações.','Cursos')}<section class="section-sm"><div class="container"><div class="flex-wrap mb24"><button class="btn ${!state.courseFilter?'':'btn-ghost'} btn-sm" data-act="course-filter" data-value="">Todos os cursos</button><button class="btn ${state.courseFilter==='scheduled'?'':'btn-ghost'} btn-sm" data-act="course-filter" data-value="scheduled">Turmas programadas</button><button class="btn ${state.courseFilter==='demand'?'':'btn-ghost'} btn-sm" data-act="course-filter" data-value="demand">Sob demanda</button></div><p class="small text-muted mb24">${courses.length} curso(s) demonstrativo(s) · Solicitar vaga não significa matrícula confirmada.</p><div class="grid cols-3">${courses.map(courseCard).join('')}</div></div></section>`}
function courseDetail(id){const c=data.courses.find(x=>String(x.id)===String(id));if(!c)return missing();const requested=data.courseRequests.find(x=>x.courseId===c.id);return `${pageHead(c.title,`${c.institution} · ${c.location}`,'Detalhes do curso')}<section class="section-sm"><div class="container detail-layout"><main class="detail-stack"><div class="card"><div class="flex-wrap mb16"><span class="badge ${c.type==='demand'?'orange':'green'}">${c.type==='demand'?'Sob demanda':'Turma programada'}</span><span class="badge">${esc(c.mode)}</span><span class="badge">${esc(c.category)}</span></div><h3>Sobre o curso</h3><p class="text-muted mt16">${esc(c.description)}</p><div class="divider"></div><div class="grid cols-2"><div><span class="small text-muted">Carga horária</span><div class="strong mt8">${esc(c.hours)} horas</div></div><div><span class="small text-muted">Modalidade</span><div class="strong mt8">${esc(c.mode)}</div></div><div><span class="small text-muted">Instituição responsável</span><div class="strong mt8">${esc(c.institution)}</div></div><div><span class="small text-muted">Início</span><div class="strong mt8">${c.type==='scheduled'?shortDate(c.start):'A definir'}</div></div></div></div><div class="card"><h3>O que você pode aprender</h3><div class="check-list">${c.skills.map(x=>`<div class="check-item">${icon('checkCircle','sm')}<span>${esc(x)}</span></div>`).join('')}</div></div>${c.type==='demand'?`<div class="notice warning">Curso em levantamento de demanda. O registro de interesse não garante abertura de turma nem matrícula.</div>`:`<div class="notice">Solicitações de inscrição passam por confirmação administrativa. O curso só aparecerá como matrícula confirmada após análise.</div>`}</main><aside class="detail-aside"><div class="card"><h3>Participe desta formação</h3><p class="small text-muted mt12">${c.type==='scheduled'?'Turma com calendário anunciado.':'Ajude a demonstrar a demanda por esta capacitação.'}</p><div class="divider"></div><div class="mini-list"><div class="flex">${icon('clock','sm')} <span class="small">${esc(c.hours)} horas</span></div><div class="flex">${icon('pin','sm')}<span class="small">${esc(c.location)}</span></div><div class="flex">${icon('users','sm')}<span class="small">${c.type==='scheduled'?`${fmtNum(c.openings)} vagas previstas`:'Turma ainda não definida'}</span></div></div><div class="divider"></div><button class="btn btn-yellow btn-block" data-act="request-course" data-id="${c.id}">${requested?(requested.type==='demand'?'Interesse registrado':'Solicitação enviada'):(c.type==='demand'?'Registrar interesse':'Solicitar inscrição')} ${icon('arrow','sm')}</button><p class="tiny text-muted mt16">${requested?'Você pode acompanhar isso em Meus cursos.':'O registro é demonstrativo e não cria inscrição real.'}</p></div><a href="#/cursos" class="link flex mt20">${icon('arrowLeft','sm')} Voltar aos cursos</a></aside></div></section>`}
function about(){return `${pageHead('Sobre o GO São Luís','Conexões mais próximas para que talento, oportunidade e qualificação avancem juntos.','Sobre o GO')}<section class="section"><div class="container grid cols-2" style="align-items:center"><div><div class="eyebrow">Por que estamos aqui</div><h2 class="mt12">São Luís tem talentos. Nosso propósito é aproximá-los das oportunidades.</h2><p class="title-intro mt16">O GO São Luís é uma proposta de portal de empregabilidade e capacitação, pensada para começar com foco na região Itaqui-Bacanga e futuramente integrar o ecossistema digital do Parque Tecnológico de São Luís.</p><p class="text-muted mt16">O projeto considera o cadastro de profissionais, divulgação de vagas, busca de talentos por empresas, acesso a cursos e acompanhamento de resultados pela SEMISPE.</p></div><div class="card" style="background:#EEF7FC;padding:38px"><div class="icon-disc">${icon('pin','lg')}</div><h3 class="mt20">Itaqui-Bacanga em primeiro plano</h3><p class="text-muted mt16">O foco inicial é territorial. As oportunidades podem estar em diferentes regiões de São Luís, respeitando as preferências e condições de deslocamento dos participantes.</p><div class="divider"></div><span class="badge green">Conceito em desenvolvimento</span></div></div></section><section class="section bg-mist"><div class="container">${sectionHeading('Ecossistema','Quem participa','Diferentes agentes conectados em uma mesma plataforma.')}<div class="grid cols-3"><div class="card"><div class="icon-disc">${icon('user','lg')}</div><h4 class="mt16">Profissionais</h4><p class="small text-muted mt8">Constroem o perfil, encontram vagas e acessam capacitações.</p></div><div class="card"><div class="icon-disc green">${icon('building','lg')}</div><h4 class="mt16">Empresas</h4><p class="small text-muted mt8">Divulgam oportunidades e encontram pessoas por categoria.</p></div><div class="card"><div class="icon-disc yellow">${icon('chart','lg')}</div><h4 class="mt16">SEMISPE</h4><p class="small text-muted mt8">Organiza cursos e monitora indicadores dos programas.</p></div></div></div></section><section class="section"><div class="container"><div class="notice">Este protótipo foi preparado para apresentação e avaliação de experiência. Não é um portal oficial em operação nem possui integração ativa com gov.br, CNPJ, WhatsApp Business ou sistemas da SEMISPE.</div></div></section>`}
function missing(){return `${pageHead('Página não encontrada','Não encontramos o endereço solicitado.','404')}<section class="section"><div class="container">${emptyState('Não encontramos esta página','Verifique o endereço ou retorne ao início.','/','Voltar ao início')}</div></section>`}
function loginPage(){return `<div class="auth-page"><div class="card"><div class="eyebrow">Bem-vindo de volta</div><h1 class="mt12">Acesse sua conta</h1><p>Entre com seu cadastro GO São Luís. Nesta demonstração, as contas são ilustrativas.</p><form id="login-form"><div class="field"><label for="login-email">E-mail</label><input class="input" id="login-email" name="email" type="email" placeholder="voce@exemplo.com" required /></div><div class="field"><label for="login-password">Senha</label><input class="input" id="login-password" name="password" type="password" placeholder="Sua senha" required /></div><div class="space-between small mb24"><label class="flex"><input type="checkbox" /> Manter conectado</label><a class="link" href="#/esqueci-senha">Esqueci minha senha</a></div><button class="btn btn-yellow btn-block" type="submit">Entrar ${icon('arrow','sm')}</button></form><div class="auth-separator">ou explore</div><div class="grid cols-2" style="gap:9px"><button class="btn btn-ghost btn-sm" data-act="login-as" data-value="person">Candidato demo</button><button class="btn btn-ghost btn-sm" data-act="login-as" data-value="company">Empresa demo</button><button class="btn btn-ghost btn-sm" data-act="login-as" data-value="admin">SEMISPE demo</button><a class="btn btn-ghost btn-sm" href="#/cadastro">Criar conta</a></div><div class="notice mt20">A tela de login é visual. Não há autenticação real nem envio de senhas; para testar, use os perfis demonstrativos acima.</div></div></div>`}
function signupChoose(){return `<div class="auth-page" style="max-width:720px"><div class="eyebrow align-center">Comece por aqui</div><h1 class="align-center mt12">Como deseja se cadastrar?</h1><p class="text-muted align-center mt12 mb24">O cadastro é gratuito. Escolha o tipo de conta que corresponde ao seu objetivo.</p><div class="grid cols-2"><a href="#/cadastro/pessoa" class="option-card"><span class="icon-disc">${icon('user','lg')}</span><div><h4>Sou pessoa física</h4><p>Busco emprego ou capacitação profissional.</p></div>${icon('chevron')}</a><a href="#/cadastro/empresa" class="option-card"><span class="icon-disc green">${icon('building','lg')}</span><div><h4>Represento uma empresa</h4><p>Quero cadastrar vagas ou buscar profissionais.</p></div>${icon('chevron')}</a></div><div class="align-center mt24">Já possui conta? <a class="link" href="#/entrar">Entrar</a></div></div>`}
function signupForm(type){const company=type==='empresa';return `<div class="auth-page" style="max-width:680px"><a class="link flex mb24" href="#/cadastro">${icon('arrowLeft','sm')} Voltar</a><div class="card"><div class="eyebrow">Cadastro gratuito</div><h1 class="mt12">${company?'Conta de empresa':'Conta de pessoa física'}</h1><p>${company?'Empresas e MEIs com CNPJ ativo podem divulgar vagas e encontrar profissionais.':'Crie sua conta para elaborar currículo, consultar matches e se candidatar.'}</p><form id="signup-form" data-type="${type}"><div class="form-grid">${company?`<div class="field"><label for="signup-name">Razão social / nome da empresa *</label><input class="input" id="signup-name" name="name" required placeholder="Nome da organização" /></div><div class="field"><label for="signup-cnpj">CNPJ *</label><input class="input" id="signup-cnpj" name="cnpj" inputmode="numeric" required placeholder="00.000.000/0000-00" /></div><div class="field"><label for="signup-sector">Área de atuação</label><input class="input" id="signup-sector" name="sector" placeholder="Ex.: Logística" /></div><div class="field"><label for="signup-rep">Responsável</label><input class="input" id="signup-rep" name="rep" placeholder="Nome do representante" /></div>`:`<div class="field"><label for="signup-name">Nome completo *</label><input class="input" id="signup-name" name="name" required placeholder="Nome e sobrenome" /></div><div class="field"><label for="signup-neigh">Bairro *</label><input class="input" id="signup-neigh" name="neighborhood" placeholder="Ex.: Anjo da Guarda" required /></div>`}<div class="field"><label for="signup-email">E-mail *</label><input class="input" type="email" id="signup-email" name="email" required placeholder="voce@exemplo.com" /></div><div class="field"><label for="signup-phone">Celular</label><input class="input" id="signup-phone" name="phone" placeholder="(98) 90000-0000" /></div><div class="field"><label for="signup-password">Senha *</label><input class="input" id="signup-password" name="password" type="password" minlength="6" required placeholder="Mínimo 6 caracteres" /></div><div class="field"><label for="signup-password2">Confirmar senha *</label><input class="input" id="signup-password2" name="password2" type="password" minlength="6" required placeholder="Repita sua senha" /></div></div><label class="flex small mt16" style="align-items:start"><input type="checkbox" required style="margin-top:5px" /><span>Entendo que este é um protótipo local, com dados armazenados apenas neste navegador, e não um cadastro oficial.</span></label><button class="btn btn-yellow btn-block mt24" type="submit">Criar conta de demonstração ${icon('arrow','sm')}</button></form><div class="notice mt20">${company?'Validação de CNPJ em base oficial não está conectada neste protótipo.':'O número de WhatsApp poderá ser vinculado posteriormente no perfil.'}</div></div></div>`}
function forgotPage(){return `<div class="auth-page"><div class="card"><h1>Recuperar acesso</h1><p>Informe o e-mail para solicitar redefinição de senha.</p><form id="forgot-form"><div class="field"><label>E-mail cadastrado</label><input type="email" name="email" class="input" required placeholder="voce@exemplo.com" /></div><button class="btn btn-yellow btn-block">Solicitar recuperação</button></form><div class="notice mt20">O envio de e-mail não está conectado neste protótipo.</div></div></div>`}
function appSideLink(name,path,ico,route){return `<a class="side-link ${route===path||(path!=='/'&&route.startsWith(path+'/'))?'active':''}" href="#${path}">${icon(ico,'sm')} ${name}</a>`}
function appShell(role,route,title,subtitle,body,actions=''){const list=role==='person'?[['Visão geral','/painel','dashboard'],['Encontrar vagas','/vagas','brief'],['Meu currículo','/meu-curriculo','file'],['Candidaturas','/minhas-candidaturas','checkCircle'],['Meus cursos','/meus-cursos','graduation'],['Meu perfil','/perfil','settings']]:role==='company'?[['Visão geral','/empresa','dashboard'],['Minhas vagas','/empresa/vagas','brief'],['Publicar vaga','/empresa/vagas/nova','plus'],['Candidaturas','/empresa/candidaturas','users'],['Serviços','/empresa/servicos','search'],['Minha empresa','/empresa/perfil','building']]:[['Visão geral','/admin','dashboard'],['Empresas','/admin/empresas','building'],['Profissionais','/admin/usuarios','users'],['Vagas','/admin/vagas','brief'],['Cursos e turmas','/admin/cursos','graduation'],['Indicadores','/admin/indicadores','chart']];return `<div class="app-shell"><aside class="sidebar no-print"><div class="sidebar-label">${role==='person'?'Minha área':role==='company'?'Área da empresa':'Administração SEMISPE'}</div>${list.map(([n,p,i])=>appSideLink(n,p,i,route)).join('')}</aside><main class="app-content"><div class="app-head no-print"><div><h1>${title}</h1><p>${subtitle}</p></div>${actions}</div>${body}</main></div>`}
function metric(title,value,iconName,foot){return `<div class="metric"><div class="space-between"><label>${esc(title)}</label>${icon(iconName)}</div><strong>${esc(value)}</strong><div class="foot">${esc(foot)}</div></div>`}
function applicantDashboard(route){const total=data.applications.length,cr=data.courseRequests.length;const recent=data.applications.slice(-3).reverse();return appShell('person',route,`Olá, ${esc(data.profile.name.split(' ')[0])}!`,'Aqui você acompanha suas oportunidades e próximos passos.',`<div class="grid cols-3">${metric('Candidaturas',fmtNum(total),'brief','Inscrições de demonstração')}${metric('Cursos acompanhados',fmtNum(cr),'graduation','Interesses e solicitações')}${metric('Currículo','Disponível','file','Perfil profissional editável')}</div><div class="dash-panels"><div class="card"><div class="space-between mb16"><h3>Minhas candidaturas</h3><a href="#/minhas-candidaturas" class="link small">Ver todas</a></div>${recent.length?recent.map(a=>{const j=data.jobs.find(x=>x.id===a.jobId);return `<div class="mini-item"><span class="icon-disc">${icon('brief','sm')}</span><div style="flex:1"><strong>${esc(j?.title||'Vaga')}</strong><div class="small text-muted">${esc(j?.company||'Empresa')} · ${shortDate(a.date)}</div></div>${statusBadge(a.status)}</div>`}).join(''):emptyState('Nenhuma candidatura','Explore as vagas disponíveis para começar.')}</div><div class="card"><h3>Próximos passos</h3><div class="mini-item"><span class="icon-disc">${icon('file','sm')}</span><div><strong>Seu currículo</strong><p class="small text-muted">Revise habilidades e experiências para melhorar as recomendações.</p><a class="link small" href="#/meu-curriculo">Ver currículo</a></div></div><div class="mini-item"><span class="icon-disc green">${icon('graduation','sm')}</span><div><strong>Capacitações</strong><p class="small text-muted">Descubra cursos e registre seu interesse.</p><a class="link small" href="#/cursos">Explorar cursos</a></div></div><div class="mini-item"><span class="icon-disc yellow">${icon('message','sm')}</span><div><strong>Assistente por conversa</strong><p class="small text-muted">Teste a experiência guiada no protótipo.</p><button class="btn-text small" data-act="open-wa">Abrir conversa</button></div></div></div></div><div class="card mt24"><div class="space-between mb16"><h3>Vagas para explorar</h3><a href="#/vagas" class="link small">Ver vagas</a></div><div class="grid cols-2">${data.jobs.filter(j=>j.active).slice(0,2).map(jobCard).join('')}</div></div>`)}
function resumePage(route){const p=data.profile;return appShell('person',route,'Meu currículo','Gerencie suas informações profissionais e seu currículo em PDF.',`<div class="space-between mb24 no-print" style="flex-wrap:wrap"><div class="notice" style="flex:1">Seu perfil estruturado é a base para recomendações. O PDF é uma apresentação dessas informações.</div><div class="flex-wrap"><a href="#/meu-curriculo/editar" class="btn btn-ghost btn-sm">${icon('edit','sm')} Editar</a><a href="#/meu-curriculo/ia" class="btn btn-ghost btn-sm">${icon('spark','sm')} Assistente de IA</a><button class="btn btn-sm" data-act="print-cv">${icon('download','sm')} Gerar PDF</button></div></div><div class="resume-paper" id="resume-print"><h2>${esc(p.name)}</h2><p>${esc(p.neighborhood)} · ${esc(p.city)} | ${esc(p.phone)} | ${esc(p.email)}</p><h4>Objetivo profissional</h4><p>${esc(p.objective||'A definir')}</p><h4>Resumo profissional</h4><p>${esc(p.summary||'Ainda não informado')}</p><h4>Experiência</h4><p>${esc(p.experience||'Ainda não informada')}</p><h4>Formação acadêmica</h4><p>${esc(p.education||'Ainda não informada')}</p><h4>Competências</h4><p>${esc(p.skills||'Ainda não informadas')}</p>${p.courses?`<h4>Cursos e certificações</h4><p>${esc(p.courses)}</p>`:''}${p.languages?`<h4>Idiomas</h4><p>${esc(p.languages)}</p>`:''}</div><div class="notice mt24 no-print">Use “Gerar PDF” para abrir a impressão do navegador e escolher “Salvar como PDF”. A geração de PDF em servidor ainda não está implementada.</div>`)}
function resumeEdit(route){const p=data.profile;const fields=[['Nome completo','name'],['E-mail','email'],['Celular','phone'],['Bairro','neighborhood'],['Cidade','city'],['Objetivo profissional','objective'],['Formação','education'],['Idiomas','languages']];return appShell('person',route,'Editar currículo','Atualize os dados utilizados nas candidaturas e na análise demonstrativa.',`<form id="resume-form"><div class="form-section"><h3>Dados e objetivo</h3><div class="form-grid">${fields.map(([l,n])=>`<div class="field"><label for="r-${n}">${l}</label><input class="input" id="r-${n}" name="${n}" value="${esc(p[n]||'')}" /></div>`).join('')}</div></div><div class="form-section"><h3>Experiências e competências</h3>${[['Resumo profissional','summary'],['Experiência profissional','experience'],['Competências (separe por vírgulas)','skills'],['Cursos e certificações','courses']].map(([l,n])=>`<div class="field"><label for="r-${n}">${l}</label><textarea class="textarea" id="r-${n}" name="${n}">${esc(p[n]||'')}</textarea></div>`).join('')}<div class="notice">Confirme as informações antes de salvar. O protótipo usa correspondência simples de competências; não há análise de IA conectada.</div><div class="form-actions"><a href="#/meu-curriculo" class="btn btn-ghost">Cancelar</a><button class="btn btn-yellow" type="submit">Salvar currículo ${icon('check','sm')}</button></div></div></form>`)}
function resumeIA(route){return appShell('person',route,'Currículo assistido','A proposta é conversar com a IA pelo WhatsApp e organizar suas experiências.',`<div class="grid cols-2"><div class="card"><span class="icon-disc">${icon('message','lg')}</span><h3 class="mt20">Comece por uma conversa</h3><p class="text-muted mt12">Descreva sua trajetória e responda às perguntas orientadas. No produto final, o atendimento poderá ocorrer no WhatsApp conectado à conta.</p><div class="notice warning mt20">Nesta versão HTML, a conversa funciona apenas como simulação local, não como IA real ou integração com WhatsApp Business.</div><button class="btn btn-yellow mt24" data-act="open-wa">${icon('message','sm')} Iniciar demonstração</button></div><div class="card"><h3>Etapas previstas</h3><div class="steps-vertical mt24"><div class="step-line"><span class="index">1</span><div><strong>Identificar experiências</strong><p class="small text-muted">A conversa coleta atividades, períodos, estudos e habilidades.</p></div></div><div class="step-line"><span class="index">2</span><div><strong>Revisar informações</strong><p class="small text-muted">A pessoa confirma que os dados estão corretos.</p></div></div><div class="step-line"><span class="index">3</span><div><strong>Salvar currículo</strong><p class="small text-muted">O perfil estruturado fica disponível no portal.</p></div></div><div class="step-line"><span class="index">4</span><div><strong>Consultar oportunidades</strong><p class="small text-muted">O currículo serve de base para explicações de compatibilidade.</p></div></div></div><a class="btn btn-ghost mt24" href="#/meu-curriculo/editar">Prefiro preencher manualmente</a></div></div><div class="card mt24"><h3>Importar currículo existente</h3><p class="text-muted small mt8">Interface para demonstrar o fluxo de upload. Não ocorre extração de texto nesta versão.</p><form id="upload-form" class="mt20"><div class="field"><label for="cv-file">Escolher arquivo (PDF ou DOCX)</label><input class="input" type="file" id="cv-file" accept=".pdf,.docx" required /></div><button class="btn btn-ghost" type="submit">${icon('upload','sm')} Simular envio</button></form></div>`)}
function statusBadge(s){const color=['Contratado','Confirmada','Concluído','Certificado'].includes(s)?'green':['Não aprovação','Recusada','Desistência','Cancelada'].includes(s)?'red':['Em análise','Entrevista','Aguardando confirmação'].includes(s)?'orange':'grey';return `<span class="badge ${color}">${esc(s)}</span>`}
function applicationsPage(route){return appShell('person',route,'Minhas candidaturas','Acompanhe o andamento das vagas às quais você se candidatou.',`<div class="card">${data.applications.length?`<div class="data-table-wrap"><table class="data-table"><thead><tr><th>Vaga</th><th>Empresa</th><th>Data</th><th>Status</th><th>Detalhes</th></tr></thead><tbody>${data.applications.map(a=>{const j=data.jobs.find(j=>j.id===a.jobId);return `<tr><td><strong>${esc(j?.title||'Vaga')}</strong></td><td>${esc(j?.company||'Empresa')}</td><td>${shortDate(a.date)}</td><td>${statusBadge(a.status)}</td><td><a class="link" href="#/vagas/${a.jobId}">Ver vaga</a> ${['Inscrito','Em análise','Entrevista'].includes(a.status)?`<button class="btn-text small" data-act="withdraw" data-id="${a.id}">Desistir</button>`:''}</td></tr>`}).join('')}</tbody></table></div><div class="notice mt24">Etapas demonstrativas: Inscrito → Em análise → Entrevista → Contratado, com possibilidades de desistência e não aprovação. A atualização oficial exige integração e regras de permissão.</div>`:emptyState('Você ainda não se candidatou','Quando você se inscrever em uma vaga, ela aparecerá aqui.','/vagas','Explorar vagas')}</div>`)}
function myCourses(route){return appShell('person',route,'Meus cursos','Consulte suas solicitações, interesses e andamento das capacitações.',`<div class="card">${data.courseRequests.length?`<div class="data-table-wrap"><table class="data-table"><thead><tr><th>Curso</th><th>Modalidade</th><th>Solicitado em</th><th>Situação</th><th>Ações</th></tr></thead><tbody>${data.courseRequests.map(x=>{const c=data.courses.find(c=>c.id===x.courseId);return `<tr><td><strong>${esc(c?.title||'Curso')}</strong></td><td>${x.type==='demand'?'Sob demanda':'Turma programada'}</td><td>${shortDate(x.date)}</td><td>${statusBadge(x.status)}</td><td><a class="link" href="#/cursos/${x.courseId}">Ver detalhes</a></td></tr>`}).join('')}</tbody></table></div><p class="small text-muted mt24">Frequência e certificação aparecem após atualização pela administração do programa.</p>`:emptyState('Nenhum curso acompanhado','Encontre cursos programados ou registre seu interesse em novas turmas.','/cursos','Explorar cursos')}</div>`)}
function personProfile(route){const p=data.profile;return appShell('person',route,'Meu perfil','Informações da conta, preferências e vinculação de canais de atendimento.',`<div class="grid cols-2"><div class="card"><div class="account-top"><span class="avatar">${esc(p.name.split(' ').map(s=>s[0]).slice(0,2).join(''))}</span><div><h3>${esc(p.name)}</h3><p class="small text-muted">${esc(p.email)}</p></div></div><div class="divider"></div><div class="mini-list"><div><span class="control-label">Bairro</span><strong>${esc(p.neighborhood)}</strong></div><div><span class="control-label">Objetivo</span><strong>${esc(p.objective)}</strong></div><div><span class="control-label">Celular</span><strong>${esc(p.phone)}</strong></div></div><a href="#/meu-curriculo/editar" class="btn btn-ghost mt24">Editar informações</a></div><div class="card"><h3>Visibilidade e WhatsApp</h3><p class="text-muted small mt8">Controle quais recursos demonstrativos estão habilitados.</p><label class="mini-item" style="align-items:center;cursor:pointer"><input type="checkbox" id="public-profile" ${p.publicProfile?'checked':''}/><span><strong>Perfil público para empresas</strong><p class="small text-muted">Exibir informações profissionais resumidas na busca de talentos. Nunca CPF ou contato por padrão.</p></span></label><label class="mini-item" style="align-items:center;cursor:pointer"><input type="checkbox" id="wa-linked" ${p.whatsapp?'checked':''}/><span><strong>Simular WhatsApp vinculado</strong><p class="small text-muted">No produto real, vinculação exige confirmação segura do número.</p></span></label><button class="btn btn-ghost mt20" data-act="open-wa">Testar assistente</button></div></div>`)}
function companyDashboard(route){const my=data.jobs.filter(j=>j.owner==='empresa');const apps=data.applications.filter(a=>my.some(j=>j.id===a.jobId));return appShell('company',route,'Visão geral da empresa','Gerencie vagas e descubra profissionais por categoria.',`<div class="grid cols-3">${metric('Vagas publicadas',fmtNum(my.length),'brief','Oportunidades vinculadas à empresa')}${metric('Vagas ativas',fmtNum(my.filter(j=>j.active).length),'checkCircle','Anúncios em aberto')}${metric('Candidaturas recebidas',fmtNum(apps.length),'users','Somente vagas da organização')}</div><div class="dash-panels"><div class="card"><div class="space-between mb16"><h3>Minhas vagas</h3><a href="#/empresa/vagas" class="link small">Gerenciar</a></div>${my.length?my.map(j=>`<div class="mini-item"><span class="icon-disc">${icon('brief','sm')}</span><div style="flex:1"><strong>${esc(j.title)}</strong><p class="small text-muted">${esc(j.location)} · ${j.active?'Ativa':'Encerrada'}</p></div><a class="btn btn-ghost btn-sm" href="#/empresa/vagas/${j.id}/candidatos">Candidaturas</a></div>`).join(''):emptyState('Nenhuma vaga publicada','Cadastre uma vaga para começar.','/empresa/vagas/nova','Criar vaga')}</div><div class="card" style="background:#F4FAFD"><span class="icon-disc green">${icon('users','lg')}</span><h3 class="mt20">Encontre novos talentos</h3><p class="text-muted mt12">Busque pessoas por competências, localização aproximada e categoria de atuação.</p><a href="#/empresa/servicos" class="btn btn-yellow mt24">Buscar profissionais ${icon('arrow','sm')}</a><div class="divider"></div><p class="small text-muted">As empresas não visualizam o score individual de candidatos nesta versão.</p></div></div>`,`<a class="btn btn-yellow" href="#/empresa/vagas/nova">${icon('plus','sm')} Publicar vaga</a>`)}
function companyJobs(route){const jobs=data.jobs.filter(j=>j.owner==='empresa');return appShell('company',route,'Minhas vagas','Publique, edite e acompanhe as oportunidades da sua organização.',`<div class="card">${jobs.length?`<div class="data-table-wrap"><table class="data-table"><thead><tr><th>Cargo</th><th>Local</th><th>Vagas</th><th>Prazo</th><th>Situação</th><th>Ações</th></tr></thead><tbody>${jobs.map(j=>`<tr><td><strong>${esc(j.title)}</strong></td><td>${esc(j.location)}</td><td>${fmtNum(j.openings)}</td><td>${shortDate(j.deadline)}</td><td>${statusBadge(j.active?'Ativa':'Encerrada')}</td><td><div class="table-actions"><a class="btn btn-ghost btn-sm" href="#/empresa/vagas/${j.id}/editar">Editar</a><a class="btn btn-ghost btn-sm" href="#/empresa/vagas/${j.id}/candidatos">Inscritos</a><button class="btn btn-ghost btn-sm" data-act="toggle-job" data-id="${j.id}">${j.active?'Encerrar':'Reabrir'}</button></div></td></tr>`).join('')}</tbody></table></div>`:emptyState('Nenhuma vaga publicada','Comece divulgando uma oportunidade para profissionais locais.','/empresa/vagas/nova','Publicar vaga')}</div>`,`<a href="#/empresa/vagas/nova" class="btn btn-yellow">${icon('plus','sm')} Nova vaga</a>`)}
function companyJobForm(route,id){const edit=!!id;const j=edit?data.jobs.find(j=>String(j.id)===String(id)&&j.owner==='empresa'):{};if(edit&&!j)return accessDenied();const v=(n)=>esc(j[n]??'');return appShell('company',route,edit?'Editar vaga':'Publicar nova vaga','Preencha os dados estruturados para facilitar a busca de profissionais.',`<form id="company-job-form" data-id="${edit?j.id:''}"><div class="form-section"><h3>Informações da oportunidade</h3><div class="form-grid"><div class="field"><label>Cargo / título *</label><input name="title" class="input" required placeholder="Ex.: Assistente de logística" value="${v('title')}"/></div><div class="field"><label>Bairro / local *</label><input name="location" class="input" required placeholder="Ex.: Itaqui-Bacanga" value="${v('location')}"/></div><div class="field"><label>Modalidade</label><select class="select" name="mode">${['Presencial','Híbrido','Remoto'].map(x=>`<option ${j.mode===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>Tipo de contratação</label><select class="select" name="type">${['CLT','Estágio','Aprendiz','Temporário','Outro'].map(x=>`<option ${j.type===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>Quantidade de vagas *</label><input name="openings" class="input" type="number" min="1" required value="${v('openings')||1}"/></div><div class="field"><label>Salário mensal (R$)</label><input name="salary" class="input" type="number" min="0" step="0.01" placeholder="Opcional" value="${v('salary')}"/></div><div class="field"><label>Data final de candidatura *</label><input name="deadline" class="input" type="date" required value="${v('deadline')}"/></div><div class="field"><label>Escolaridade mínima</label><select class="select" name="education">${['Ensino fundamental','Ensino médio','Técnico concluído','Superior cursando','Superior concluído','Não exigida'].map(x=>`<option ${j.education===x?'selected':''}>${x}</option>`).join('')}</select></div></div><div class="field"><label>Descrição da vaga *</label><textarea class="textarea" name="description" required placeholder="O que será feito?">${v('description')}</textarea></div></div><div class="form-section"><h3>Requisitos e benefícios</h3><div class="field"><label>Competências obrigatórias (separadas por vírgula)</label><textarea name="skills" class="textarea" placeholder="Excel, Atendimento, Organização">${esc((j.skills||[]).join(', '))}</textarea><span class="hint">Esses requisitos alimentam o score demonstrativo de compatibilidade.</span></div><div class="field"><label>Competências desejáveis</label><input name="desired" class="input" value="${esc((j.desired||[]).join(', '))}" placeholder="Ex.: Power BI, Inglês" /></div><div class="field"><label>Benefícios</label><input name="benefits" class="input" value="${esc((j.benefits||[]).join(', '))}" placeholder="Ex.: Vale-transporte, Plano de saúde"/></div><div class="form-actions"><a href="#/empresa/vagas" class="btn btn-ghost">Cancelar</a><button class="btn btn-yellow" type="submit">${edit?'Salvar alterações':'Publicar vaga'} ${icon('check','sm')}</button></div></div></form>`)}
function companyApplications(route,id){const mine=data.jobs.filter(j=>j.owner==='empresa');const j=id?mine.find(j=>String(j.id)===String(id)):null;const related=data.applications.filter(a=>(j?a.jobId===j.id:mine.some(x=>x.id===a.jobId)));return appShell('company',route,j?`Candidaturas: ${esc(j.title)}`:'Candidaturas recebidas','Visualização restrita a inscrições nas vagas da própria organização.',`<div class="card">${related.length?`<div class="data-table-wrap"><table class="data-table"><thead><tr><th>Profissional</th><th>Vaga</th><th>Data</th><th>Status disponível</th></tr></thead><tbody>${related.map(a=>`<tr><td><strong>${esc(data.profile.name)}</strong></td><td>${esc(data.jobs.find(j=>j.id===a.jobId)?.title||'Vaga')}</td><td>${shortDate(a.date)}</td><td>${statusBadge(a.status)}</td></tr>`).join('')}</tbody></table></div><div class="notice mt24">O acesso a candidaturas é restrito às vagas da empresa. A edição de estados depende de permissões ainda a definir com a SEMISPE.</div>`:emptyState('Nenhuma candidatura recebida','Quando profissionais se candidatarem às suas vagas, serão listados aqui.')}</div>`)}
function servicesPage(route){const list=data.professionals;return appShell('company',route,'Serviços · Encontrar profissionais','Pesquise perfis profissionais autorizados por categoria de atuação.',`<div class="notice mb24">Todos os perfis abaixo são fictícios e simulam pessoas que autorizaram divulgação. Dados privados e score de match não são exibidos.</div><div class="card mb24"><form id="services-filter" class="flex-wrap" style="align-items:end"><div style="flex:2;min-width:210px"><label class="control-label">Buscar por categoria ou competência</label><input class="input" id="services-query" placeholder="Ex.: Logística, Python, Atendimento" /></div><button class="btn" type="submit">${icon('search','sm')} Buscar profissionais</button><button class="btn btn-ghost" type="button" data-act="clear-services">Limpar</button></form></div><div id="services-results" class="grid cols-2">${list.map(profCard).join('')}</div>`)}
function profCard(p){return `<div class="card"><div class="flex"><span class="avatar">${esc(p.initials)}</span><div><h4>${esc(p.name)}</h4><p class="small text-muted">${esc(p.category)}</p></div></div><div class="job-meta mt16">${icon('pin','sm')} ${esc(p.location)}</div><p class="small text-muted mt16">${esc(p.bio)}</p><div class="tag-row mt16">${p.skills.map(x=>`<span class="chip">${esc(x)}</span>`).join('')}</div><button class="btn btn-ghost btn-sm mt24" data-act="contact-prof" data-id="${p.id}">Demonstrar interesse ${icon('arrow','sm')}</button></div>`}
function companyProfile(route){const c=data.company;return appShell('company',route,'Perfil da empresa','Dados cadastrais da organização e situação de verificação.',`<div class="grid cols-2"><div class="card"><div class="flex"><span class="company-mark">PN</span><div><h3>${esc(c.name)}</h3><span class="badge green">${esc(c.validated)}</span></div></div><div class="divider"></div>${[['CNPJ',c.cnpj],['Área de atuação',c.sector],['Localidade',c.location],['E-mail de contato',c.email]].map(([l,v])=>`<div class="mini-item"><div><span class="control-label">${l}</span><strong>${esc(v)}</strong></div></div>`).join('')}</div><div class="card"><h3>Cadastro empresarial</h3><p class="text-muted mt12">O produto prevê cadastro gratuito para empresas e startups com CNPJ ativo, incluindo MEI.</p><div class="notice warning mt20">A verificação de CNPJ exibida é simulada. A integração com fonte cadastral oficial está fora deste HTML.</div><a class="btn btn-ghost mt24" href="#/empresa/vagas">Gerenciar vagas</a></div></div>`)}
function adminDashboard(route){const requests=data.courseRequests.filter(x=>x.type==='scheduled').length;return appShell('admin',route,'Dashboard SEMISPE','Visão geral demonstrativa do ecossistema de empregabilidade e capacitação.',`<div class="notice warning mb24">Indicadores exclusivamente demonstrativos: não representam dados oficiais de São Luís, desemprego, contratações ou resultados de cursos.</div><div class="grid cols-4">${metric('Profissionais cadastrados','3','users','Perfis ilustrativos')}${metric('Empresas no exemplo','4','building','Organizações fictícias')}${metric('Vagas ativas',fmtNum(data.jobs.filter(j=>j.active).length),'brief','Dados simulados')}${metric('Solicitações de curso',fmtNum(requests),'graduation','Interesses no navegador')}</div><div class="dash-panels"><div class="card"><div class="space-between mb16"><h3>Panorama demonstrativo</h3><span class="badge">Dados do protótipo</span></div><p class="small text-muted">Exemplo de distribuição de atividades por período. Valores apenas visuais, sem base estatística.</p><div class="bar-chart" aria-label="Gráfico ilustrativo com valores fictícios">${[['Jun',34],['Jul',52],['Ago',44],['Set',71],['Out',65],['Nov',88]].map(([m,v])=>`<div class="bar-col"><div class="bar-rect" style="height:${v}%"></div><small>${m}</small></div>`).join('')}</div><p class="tiny text-muted mt24">Valores fictícios para composição visual.</p></div><div class="card"><h3>Acessos rápidos</h3><div class="mini-item"><span class="icon-disc">${icon('graduation','sm')}</span><div style="flex:1"><strong>Cursos e turmas</strong><p class="small text-muted">Gerencie solicitações e registros de conclusão.</p></div><a class="link small" href="#/admin/cursos">Abrir</a></div><div class="mini-item"><span class="icon-disc">${icon('building','sm')}</span><div style="flex:1"><strong>Empresas</strong><p class="small text-muted">Consulte dados cadastrais demonstrativos.</p></div><a class="link small" href="#/admin/empresas">Abrir</a></div><div class="mini-item"><span class="icon-disc">${icon('chart','sm')}</span><div style="flex:1"><strong>Indicadores</strong><p class="small text-muted">Veja exemplos de acompanhamento.</p></div><a class="link small" href="#/admin/indicadores">Abrir</a></div></div></div>`)}
function adminCompanies(route){const list=[data.company,{name:'Bacanga Serviços',cnpj:'Exemplo fictício',sector:'Serviços',location:'Anjo da Guarda',validated:'Demonstração'},{name:'Maré Digital',cnpj:'Exemplo fictício',sector:'Tecnologia',location:'Centro',validated:'Demonstração'},{name:'Ilha Atendimento',cnpj:'Exemplo fictício',sector:'Comércio',location:'Vila Embratel',validated:'Demonstração'}];return appShell('admin',route,'Empresas cadastradas','Visualização administrativa dos perfis empresariais.',`<div class="card"><div class="data-table-wrap"><table class="data-table"><thead><tr><th>Empresa</th><th>Setor</th><th>Localidade</th><th>Situação</th></tr></thead><tbody>${list.map(c=>`<tr><td><strong>${esc(c.name)}</strong></td><td>${esc(c.sector)}</td><td>${esc(c.location)}</td><td>${statusBadge('Demonstração')}</td></tr>`).join('')}</tbody></table></div><div class="notice mt24">No produto final, a empresa poderá cadastrar-se com CNPJ ativo após validação básica. Nenhuma validação externa ocorre aqui.</div></div>`)}
function adminUsers(route){return appShell('admin',route,'Profissionais cadastrados','Visão de perfis e qualificações com acesso administrativo limitado.',`<div class="card"><div class="data-table-wrap"><table class="data-table"><thead><tr><th>Profissional</th><th>Área</th><th>Bairro</th><th>Competências</th></tr></thead><tbody>${data.professionals.map(p=>`<tr><td><strong>${esc(p.name)}</strong></td><td>${esc(p.category)}</td><td>${esc(p.location)}</td><td>${esc(p.skills.join(', '))}</td></tr>`).join('')}</tbody></table></div><div class="notice mt24">Nomes e históricos são fictícios. Um gestor não deve visualizar automaticamente dados sensíveis ou currículos sem justificativa de acesso.</div></div>`)}
function adminJobs(route){return appShell('admin',route,'Vagas da plataforma','Monitore vagas publicadas por diferentes organizações.',`<div class="card"><div class="data-table-wrap"><table class="data-table"><thead><tr><th>Título</th><th>Empresa</th><th>Região</th><th>Prazo</th><th>Status</th></tr></thead><tbody>${data.jobs.map(j=>`<tr><td><a class="link" href="#/vagas/${j.id}">${esc(j.title)}</a></td><td>${esc(j.company)}</td><td>${esc(j.location)}</td><td>${shortDate(j.deadline)}</td><td>${statusBadge(j.active?'Ativa':'Encerrada')}</td></tr>`).join('')}</tbody></table></div></div>`)}
function adminCourses(route){return appShell('admin',route,'Cursos e turmas','Cadastre capacitações programadas e acompanhe demandas por novas turmas.',`<div class="card"><div class="data-table-wrap"><table class="data-table"><thead><tr><th>Curso</th><th>Tipo</th><th>Local</th><th>Interesses*</th><th>Ações</th></tr></thead><tbody>${data.courses.map(c=>`<tr><td><strong>${esc(c.title)}</strong><div class="small text-muted">${esc(c.institution)}</div></td><td>${c.type==='demand'?'Sob demanda':'Programado'}</td><td>${esc(c.location)}</td><td>${fmtNum(c.requests+data.courseRequests.filter(r=>r.courseId===c.id).length)}</td><td><a class="btn btn-ghost btn-sm" href="#/admin/cursos/${c.id}">Gerenciar</a></td></tr>`).join('')}</tbody></table></div><p class="tiny text-muted mt16">*Contagens de base são fictícias e as novas solicitações são armazenadas apenas localmente.</p></div>`,`<a class="btn btn-yellow" href="#/admin/cursos/novo">${icon('plus','sm')} Novo curso</a>`)}
function adminCourseForm(route){return appShell('admin',route,'Cadastrar curso','Crie uma turma programada ou uma oferta para levantamento de demanda.',`<form id="admin-course-form"><div class="form-section"><div class="form-grid"><div class="field"><label>Título do curso *</label><input class="input" name="title" required placeholder="Ex.: Gestão de estoque" /></div><div class="field"><label>Categoria</label><input class="input" name="category" placeholder="Ex.: Logística"/></div><div class="field"><label>Instituição ofertante</label><input class="input" name="institution" placeholder="Nome da instituição"/></div><div class="field"><label>Tipo *</label><select class="select" name="type" id="course-type"><option value="scheduled">Turma programada</option><option value="demand">Sob demanda</option></select></div><div class="field"><label>Modalidade</label><select class="select" name="mode"><option>Presencial</option><option>Híbrido</option><option>Online</option></select></div><div class="field"><label>Local / bairro</label><input class="input" name="location" placeholder="Ex.: Itaqui-Bacanga"/></div><div class="field"><label>Carga horária</label><input class="input" name="hours" type="number" min="1" value="24"/></div><div class="field scheduled-only"><label>Data de início</label><input class="input" name="start" type="date"/></div><div class="field scheduled-only"><label>Fim das inscrições</label><input class="input" name="deadline" type="date"/></div><div class="field scheduled-only"><label>Vagas disponíveis</label><input class="input" name="openings" type="number" min="1" value="25"/></div></div><div class="field"><label>Descrição do curso *</label><textarea class="textarea" name="description" required placeholder="Objetivo e conteúdo"></textarea></div><div class="field"><label>Competências desenvolvidas (separadas por vírgulas)</label><input class="input" name="skills" placeholder="Ex.: Excel, Organização"/></div><div class="form-actions"><a class="btn btn-ghost" href="#/admin/cursos">Cancelar</a><button class="btn btn-yellow" type="submit">${icon('check','sm')} Cadastrar curso</button></div></div></form>`)}
function adminCourseDetail(route,id){const c=data.courses.find(x=>String(x.id)===String(id));if(!c)return missing();const requests=data.courseRequests.filter(x=>x.courseId===c.id);return appShell('admin',route,c.title,'Acompanhamento de inscrições, frequência e conclusão da turma.',`<div class="grid cols-3">${metric('Interesses / pedidos',fmtNum(c.requests+requests.length),'users','Base fictícia + pedidos locais')}${metric('Confirmados localmente',fmtNum(requests.filter(x=>x.status==='Confirmada').length),'checkCircle','Matrículas de demonstração')}${metric('Certificados locais',fmtNum(requests.filter(x=>x.status==='Certificado').length),'graduation','Exemplo do fluxo de certificação')}</div><div class="card mt24"><h3>${c.type==='demand'?'Manifestação de interesses':'Solicitações para a turma'}</h3><p class="small text-muted mt8">${c.type==='demand'?'Abertura de turma depende da SEMISPE.':'Uma solicitação não equivale à matrícula confirmada.'}</p><div class="divider"></div>${requests.length?`<div class="data-table-wrap"><table class="data-table"><thead><tr><th>Participante</th><th>Solicitado</th><th>Status</th><th>Acompanhamento</th></tr></thead><tbody>${requests.map(r=>`<tr><td>${esc(data.profile.name)}</td><td>${shortDate(r.date)}</td><td>${statusBadge(r.status)}</td><td><div class="flex-wrap"><select class="select" style="min-width:150px;width:auto;min-height:35px;padding:5px 8px;font-size:12px" data-course-status="${r.id}">${(c.type==='demand'?['Interesse registrado','Turma aberta']:['Aguardando confirmação','Confirmada','Recusada','Em andamento','Concluído','Certificado']).map(s=>`<option ${r.status===s?'selected':''}>${s}</option>`).join('')}</select><button class="btn btn-ghost btn-sm" data-act="course-attendance" data-id="${r.id}">Frequência</button></div></td></tr>`).join('')}</tbody></table></div>`:emptyState('Sem solicitações locais','Faça uma solicitação pelo perfil Candidato para testar a jornada.')}<div class="notice mt24">O botão de frequência permite registrar uma presença demonstrativa. O modelo real de controle de frequência, conclusão e certificado deverá ser implementado posteriormente.</div></div>`)}
function adminIndicators(route){return appShell('admin',route,'Indicadores e acompanhamento','Painel ilustrativo para avaliação das iniciativas de empregabilidade e qualificação.',`<div class="notice warning mb24">Dados de gráficos e contadores são fictícios. O acompanhamento de egressos, renda e contratações exigirá coleta de dados válida e mecanismos de verificação.</div><div class="grid cols-3">${metric('Candidaturas registradas',fmtNum(data.applications.length),'brief','Ações feitas no protótipo')}${metric('Contratações informadas',fmtNum(data.applications.filter(a=>a.status==='Contratado').length),'checkCircle','Sem verificação externa')}${metric('Interesses em cursos',fmtNum(data.courseRequests.length),'graduation','Simulação local')}</div><div class="dash-panels"><div class="card"><h3>Demanda ilustrativa por formação</h3><div class="bar-chart">${data.courses.map(c=>{const v=Math.min(95,20+c.requests);return `<div class="bar-col" title="${esc(c.title)}"><div class="bar-rect" style="height:${v}%"></div><small>${esc(c.category.slice(0,9))}</small></div>`}).join('')}</div><p class="small text-muted mt24">Comparação visual fictícia, sem inferência estatística.</p></div><div class="card"><h3>O que acompanhar no futuro?</h3><div class="mini-item">${icon('checkCircle')} <div><strong>Presença e conclusão</strong><p class="small text-muted">Frequência, conclusão de cursos e certificados registrados.</p></div></div><div class="mini-item">${icon('checkCircle')} <div><strong>Inserção profissional</strong><p class="small text-muted">Resultados de candidaturas e contratações declaradas.</p></div></div><div class="mini-item">${icon('checkCircle')} <div><strong>Desenvolvimento de carreira</strong><p class="small text-muted">Acompanhamento longitudinal quando houver consentimento e dados suficientes.</p></div></div></div></div>`)}
function accessDenied(){return `${pageHead('Acesso restrito','Esta área está disponível apenas para um tipo específico de conta.','Acesso')}<section class="section"><div class="container">${emptyState('Troque o perfil de demonstração','Use o seletor “Explorar como” na faixa superior para acessar as áreas protegidas.','/','Voltar ao início')}</div></section>`}
function guarded(role,route,fn){return state.role===role?fn():accessDenied()}
function renderContent(route){let m;if(route==='/')return home();if(route==='/vagas')return jobsPage();if((m=route.match(/^\/vagas\/(\d+)$/)))return jobDetail(m[1]);if(route==='/cursos')return coursesPage();if((m=route.match(/^\/cursos\/(\d+)$/)))return courseDetail(m[1]);if(route==='/sobre')return about();if(route==='/entrar')return loginPage();if(route==='/cadastro')return signupChoose();if(route==='/cadastro/pessoa')return signupForm('pessoa');if(route==='/cadastro/empresa')return signupForm('empresa');if(route==='/esqueci-senha')return forgotPage();if(route==='/painel')return guarded('person',route,()=>applicantDashboard(route));if(route==='/meu-curriculo')return guarded('person',route,()=>resumePage(route));if(route==='/meu-curriculo/editar')return guarded('person',route,()=>resumeEdit(route));if(route==='/meu-curriculo/ia')return guarded('person',route,()=>resumeIA(route));if(route==='/minhas-candidaturas')return guarded('person',route,()=>applicationsPage(route));if(route==='/meus-cursos')return guarded('person',route,()=>myCourses(route));if(route==='/perfil')return guarded('person',route,()=>personProfile(route));if(route==='/empresa')return guarded('company',route,()=>companyDashboard(route));if(route==='/empresa/vagas')return guarded('company',route,()=>companyJobs(route));if(route==='/empresa/vagas/nova')return guarded('company',route,()=>companyJobForm(route));if((m=route.match(/^\/empresa\/vagas\/(\d+)\/editar$/)))return guarded('company',route,()=>companyJobForm(route,m[1]));if((m=route.match(/^\/empresa\/vagas\/(\d+)\/candidatos$/)))return guarded('company',route,()=>companyApplications(route,m[1]));if(route==='/empresa/candidaturas')return guarded('company',route,()=>companyApplications(route));if(route==='/empresa/servicos')return guarded('company',route,()=>servicesPage(route));if(route==='/empresa/perfil')return guarded('company',route,()=>companyProfile(route));if(route==='/admin')return guarded('admin',route,()=>adminDashboard(route));if(route==='/admin/empresas')return guarded('admin',route,()=>adminCompanies(route));if(route==='/admin/usuarios')return guarded('admin',route,()=>adminUsers(route));if(route==='/admin/vagas')return guarded('admin',route,()=>adminJobs(route));if(route==='/admin/cursos')return guarded('admin',route,()=>adminCourses(route));if(route==='/admin/cursos/novo')return guarded('admin',route,()=>adminCourseForm(route));if((m=route.match(/^\/admin\/cursos\/(\d+)$/)))return guarded('admin',route,()=>adminCourseDetail(route,m[1]));if(route==='/admin/indicadores')return guarded('admin',route,()=>adminIndicators(route));return missing()}
function render(){state.route=routeOf();document.title=(state.route==='/'?'Início':state.route.replaceAll('/',' · ').replace(/^ · /,''))+' · GO São Luís';document.getElementById('app').innerHTML=header(state.route)+`<div id="main-content">${renderContent(state.route)}</div>`+footer();renderOverlay();window.scrollTo({top:0,behavior:'instant'})}
function renderOverlay(){const root=document.getElementById('overlay');let s='';if(state.waOpen){s+=`<div class="whatsapp-window no-print" role="dialog" aria-label="Assistente WhatsApp — simulação"><div class="wa-head"><span class="avatar" style="background:#fff;color:var(--forest);width:38px;height:38px">${icon('message')}</span><div style="flex:1"><strong>Assistente GO São Luís</strong><br><small>Simulação local · não conectado ao WhatsApp</small></div><button class="btn-text" style="color:#fff" data-act="close-wa" aria-label="Fechar chat">${icon('x')}</button></div><div class="wa-body" id="wa-body">${state.waMessages.map(m=>`<div class="msg ${m.by==='bot'?'bot':'user'}">${esc(m.text)}</div>`).join('')}<div class="wa-chips"><button data-wa="vagas">Ver minhas vagas</button><button data-wa="cursos">Ver cursos</button><button data-wa="curriculo">Criar currículo</button><button data-wa="ajuda">Ajuda</button></div></div><form class="wa-footer" id="wa-form"><label for="wa-input" class="sr-only">Mensagem</label><input id="wa-input" name="message" autocomplete="off" placeholder="Escreva sua mensagem..." required /><button type="submit" aria-label="Enviar mensagem">${icon('send','sm')}</button></form></div>`}s+=`<button class="whatsapp-fab no-print" data-act="${state.waOpen?'close-wa':'open-wa'}" title="${state.waOpen?'Fechar assistente':'Abrir assistente'}" aria-label="${state.waOpen?'Fechar assistente':'Abrir assistente'}">${icon(state.waOpen?'x':'message','lg')}</button>`;if(state.modal){const m=state.modal;s+=`<div class="modal-backdrop no-print" id="modal-backdrop"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"><div class="space-between"><h3 id="modal-title">${esc(m.title||'Confirmar operação')}</h3><button data-act="close-modal" class="btn-text" aria-label="Fechar">${icon('x')}</button></div><p>${esc(m.message||'Confirme para prosseguir.')}</p><div class="actions"><button class="btn btn-ghost" data-act="close-modal">Cancelar</button>${m.type==='blocked'?`<button class="btn" data-act="close-modal">Entendi</button>`:`<button class="btn btn-yellow" data-act="confirm-modal">${esc(m.confirmLabel||'Confirmar')}</button>`}</div></div></div>`}root.innerHTML=s;if(state.waOpen){const b=document.getElementById('wa-body');if(b)b.scrollTop=b.scrollHeight}}
function confirmModal(title,message,onConfirm,confirmLabel='Confirmar'){state.modal={title,message,onConfirm,confirmLabel};renderOverlay()}
function doApply(id){const j=data.jobs.find(j=>j.id===id);if(!j||!j.active){toast('A vaga está encerrada ou não existe.');return}if(!needRole('person',`/vagas/${id}`))return;if(data.applications.some(a=>a.jobId===id)){toast('Você já se candidatou a essa vaga.');return}confirmModal('Confirmar candidatura',`Deseja se candidatar à vaga “${j.title}” da empresa ${j.company}? O registro será apenas demonstrativo.`,()=>{data.applications.push({id:Date.now(),jobId:id,status:'Inscrito',date:'2026-11-14'});save();go('/minhas-candidaturas');toast('Candidatura demonstrativa registrada.');},'Confirmar candidatura')}
function doCourseRequest(id){const c=data.courses.find(c=>c.id===id);if(!c)return;if(!needRole('person',`/cursos/${id}`))return;if(data.courseRequests.some(x=>x.courseId===id)){toast('Este curso já está em sua lista.');return}confirmModal(c.type==='demand'?'Registrar interesse':'Solicitar inscrição',c.type==='demand'?`Deseja registrar interesse em “${c.title}”? Isso não confirma abertura de turma.`:`Deseja solicitar inscrição em “${c.title}”? A SEMISPE precisará confirmar sua matrícula.`,()=>{data.courseRequests.push({id:Date.now(),courseId:id,date:'2026-11-14',status:c.type==='demand'?'Interesse registrado':'Aguardando confirmação',type:c.type,attendance:0});save();go('/meus-cursos');toast(c.type==='demand'?'Interesse demonstrativo registrado.':'Solicitação demonstrativa enviada.');},c.type==='demand'?'Registrar interesse':'Enviar solicitação')}
function waBot(t){state.waMessages.push({by:'bot',text:t})}function waUser(t){state.waMessages.push({by:'user',text:t})}
function waRespond(raw){const msg=String(raw||'').trim(),q=msg.toLowerCase();if(!msg)return;waUser(msg);if(state.role!=='person'){waBot('Para consultar informações pessoais, selecione “Candidato” no topo da página. Esta é uma simulação local; nunca envie sua senha aqui.');renderOverlay();return}
  if(state.waStep.startsWith('apply:')){const id=Number(state.waStep.split(':')[1]);state.waStep='idle';const j=data.jobs.find(x=>x.id===id&&x.active);if(!j){waBot('Esta vaga não está disponível.');}else if(/^(sim|confirmar|pode|ok)$/i.test(q)){if(data.applications.some(a=>a.jobId===id)){waBot('Você já possui uma candidatura registrada nessa vaga.');}else{data.applications.push({id:Date.now(),jobId:id,status:'Inscrito',date:'2026-11-14'});save();waBot(`Candidatura demonstrativa registrada para ${j.title}. Consulte Minhas candidaturas no portal para acompanhar.`);}}else{waBot('Operação cancelada. Nenhuma candidatura foi registrada.')}renderOverlay();return}
  if(state.waStep.startsWith('course:')){const id=Number(state.waStep.split(':')[1]);state.waStep='idle';const c=data.courses.find(x=>x.id===id);if(!c){waBot('Curso não encontrado.');}else if(/^(sim|confirmar|pode|ok)$/i.test(q)){if(data.courseRequests.some(r=>r.courseId===id)){waBot('Você já acompanha esse curso.');}else{data.courseRequests.push({id:Date.now(),courseId:id,date:'2026-11-14',type:c.type,status:c.type==='demand'?'Interesse registrado':'Aguardando confirmação',attendance:0});save();waBot(c.type==='demand'?'Interesse registrado na demonstração. Isso não garante abertura de turma.':'Solicitação registrada na demonstração. A inscrição ainda depende de confirmação da SEMISPE.');}}else{waBot('Operação cancelada.')}renderOverlay();return}
  const applyCommand=q.match(/(?:candidatar|inscrever|inscri[cç][aã]o)\s+(?:na?\s+)?vaga\s*(\d+)/);const courseCommand=q.match(/(?:interesse|solicitar|inscrever|inscri[cç][aã]o)\s+(?:no?\s+)?curso\s*(\d+)/);
  if(applyCommand){const id=Number(applyCommand[1]);const j=data.jobs.find(x=>x.id===id&&x.active);if(!j)waBot('Vaga não encontrada ou encerrada.');else{state.waStep=`apply:${id}`;waBot(`Confirma candidatura para ${j.title}, de ${j.company}? Responda SIM para registrar ou NÃO para cancelar.`)}renderOverlay();return}
  if(courseCommand){const id=Number(courseCommand[1]);const c=data.courses.find(x=>x.id===id);if(!c)waBot('Curso não encontrado.');else{state.waStep=`course:${id}`;waBot(`Confirma ${c.type==='demand'?'manifestação de interesse':'solicitação de inscrição'} em ${c.title}? Responda SIM ou NÃO.`)}renderOverlay();return}
  if(state.waStep==='name'){state.waStep='experience';waBot(`Obrigado, ${msg}! Qual sua experiência profissional? Descreva atividades que realizou, mesmo em trabalhos informais.`);renderOverlay();return}
  if(state.waStep==='experience'){state.draftExperience=msg;state.waStep='skills';waBot('Entendi. Quais habilidades você deseja destacar? Separe por vírgulas (ex.: atendimento, organização, Excel).');renderOverlay();return}
  if(state.waStep==='skills'){state.draftSkills=msg;state.waStep='confirm';waBot(`Resumo para confirmar:\nExperiência: ${state.draftExperience}\nCompetências: ${state.draftSkills}\nEscreva “confirmar” para salvar no currículo ou “cancelar” para descartar.`);renderOverlay();return}
  if(state.waStep==='confirm'){if(q.includes('confirm')){data.profile.experience=state.draftExperience;data.profile.skills=state.draftSkills;save();waBot('Perfil demonstrativo atualizado! Acesse Meu Currículo para revisar e salvar como PDF.');}else{waBot('Rascunho descartado. Você pode começar novamente quando quiser.')}state.waStep='idle';renderOverlay();return}
  if(/curr[ií]culo|cv|experi[eê]ncia/.test(q)){state.waStep='name';waBot('Vamos organizar seu currículo. Primeiro, como você gostaria de ser chamado(a)?');}
  else if(/vaga|trabalh|empreg|match|score/.test(q)){const scored=data.jobs.filter(j=>j.active).map(j=>({...j,score:scoreFor(j)})).sort((a,b)=>b.score.pts-a.score.pts).slice(0,3);waBot('Estas são as vagas com maior correspondência demonstrativa com as competências do seu perfil (sem considerar distância):\n'+scored.map(j=>`${j.score.pts}% · ${j.title} — ${j.company}\nAbrir: #/vagas/${j.id}\nNão identificados: ${j.score.required.filter(r=>!r.ok).map(r=>r.name).join(', ')||'nenhum requisito principal'}`).join('\n\n')+'\n\nPara uma candidatura demonstrativa direta na conversa, escreva “candidatar vaga 1” (substituindo pelo número da vaga).');}
  else if(/curso|capacita|forma[cç][aã]o|aprender/.test(q)){waBot('Capacitações em demonstração:\n'+data.courses.slice(0,3).map(c=>`${c.title} (${c.type==='demand'?'sob demanda':'turma programada'}) — #/cursos/${c.id}`).join('\n')+'\n\nPara solicitar pela conversa, escreva “solicitar curso 1” (substitua pelo número do curso).');}
  else if(/ajuda|ol[aá]|bom dia|oi|menu/.test(q)){waBot('Posso ajudar com: “criar currículo”, “ver vagas”, “ver cursos”, “candidatar vaga 1” e “solicitar curso 1”. A conexão com o WhatsApp real e a IA ainda não está implementada neste arquivo.');}
  else{waBot('Entendi sua mensagem. Esta demonstração reconhece alguns assuntos: currículo, vagas e cursos. Digite um deles para continuar.');}renderOverlay()}
document.addEventListener('click',e=>{const a=e.target.closest('[data-act]');const chip=e.target.closest('[data-wa]');if(chip){waRespond(chip.dataset.wa);return}if(!a)return;const action=a.dataset.act,id=Number(a.dataset.id),value=a.dataset.value;e.preventDefault();switch(action){
 case 'open-wa':state.waOpen=true;renderOverlay();break;
 case 'close-wa':state.waOpen=false;renderOverlay();break;
 case 'close-modal':state.modal=null;renderOverlay();break;
 case 'confirm-modal':{const cb=state.modal?.onConfirm;state.modal=null;renderOverlay();if(cb)cb();break}
 case 'login-as':{const dest=state.returnTo;state.returnTo=null;setRole(value);if(dest&&value==='person')go(dest);break}
 case 'apply':doApply(id);break;
